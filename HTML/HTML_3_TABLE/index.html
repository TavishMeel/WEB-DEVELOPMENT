<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>

    <table border="1" align="center" width="64%">
        <tr>
            <th> name </th>
            <th>course</th>
            <th> fees</th>
        </tr>
        <tr>
            <td>anil</td>
            <td>b.tech</td>
            <td>$2000000</td>
        </tr>
        <tr>
            <td>rahul</td>
            <td>b.com</td>
            <td>20000</td>
        </tr>

        <tr>
            <td>nims</td>
            <td>jecrc</td>
            <td>poornima</td>
        </tr>
    </table>
    <table border="7" align="center" width="50%">
        <tr>
            <th>phone</th>
            <th>price</th>
            <th>warranty</th>
        </tr>
        <tr>
            <td>iphone</td>
            <td>$2000</td>
            <td>2 years</td>
        </tr>
        <tr>
            <td>samsung</td>
            <td>$1500</td>
            <td>5 years</td>
        </tr>
        <tr>
            <td>realme</td>
            <td>$300</td>
            <td>1 years</td>
        </tr>
    </table>
    <table border="1" cellspacing="10" align="center" width="45%">
        <tr>
            <th>name</th>
            <th>id</th>
            <th>registration</th>
        </tr>
        <tr>
            <td>jane</td>
            <td>1</td>
            <td>26676</td>
        </tr>
        <tr>
            <td>orry</td>
            <td>2</td>
            <td>27474</td>
        </tr>
        <tr>
            <td>jack</td>
            <td>3</td>
            <td>97856</td>
        </tr>
    </table>
    <table border="1" cellpadding="10" align="center" width="50">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>25</td>
            <td>Delhi</td>
        </tr>
        <tr>
            <td>john</td>
            <td>20</td>
            <td>London</td>
        </tr>
        <tr>
            <td>Lucifer</td>
            <td>28</td>
            <td>America</td>
        </tr>

    </table>
</body>

</html>
